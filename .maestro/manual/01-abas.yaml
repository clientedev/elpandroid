appId: com.obraflow.app
name: "01 - Abas principais (logado)"
---
- runFlow:
    when:
      true: ${USER != ''}
    file: _login.yaml
- runFlow:
    when:
      true: ${USER != ''}
    commands:
      - takeScreenshot: 01-01-inicio
      - scroll
      - takeScreenshot: 01-01-inicio-r1
      - scroll
      - takeScreenshot: 01-01-inicio-r2
      - scroll
      - takeScreenshot: 01-01-inicio-r3
      - scroll
      - takeScreenshot: 01-01-inicio-r4
      - tapOn: "Obras"
      - waitForAnimationToEnd
      - takeScreenshot: 02-01-obras
      - scroll
      - takeScreenshot: 02-01-obras-r1
      - scroll
      - takeScreenshot: 02-01-obras-r2
      - tapOn: "Express"
      - waitForAnimationToEnd
      - takeScreenshot: 03-01-express
      - scroll
      - takeScreenshot: 03-01-express-r1
      - scroll
      - takeScreenshot: 03-01-express-r2
      - tapOn: "Relatórios"
      - waitForAnimationToEnd
      - takeScreenshot: 04-01-relatorios
      - scroll
      - takeScreenshot: 04-01-relatorios-r1
      - scroll
      - takeScreenshot: 04-01-relatorios-r2
      - tapOn: "Agenda"
      - waitForAnimationToEnd
      - takeScreenshot: 05-01-agenda
      - scroll
      - takeScreenshot: 05-01-agenda-r1
      - scroll
      - takeScreenshot: 05-01-agenda-r2
      - tapOn: "Ajustes"
      - waitForAnimationToEnd
      - takeScreenshot: 06-01-ajustes
      - scroll
      - takeScreenshot: 06-01-ajustes-r1
      - scroll
      - takeScreenshot: 06-01-ajustes-r2
      - scroll
      - takeScreenshot: 06-01-ajustes-r3
      - scroll
      - takeScreenshot: 06-01-ajustes-r4
