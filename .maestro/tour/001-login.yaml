appId: com.obraflow.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Entrar"
    timeout: 60000
# Aviso de nova versão (aparece quando o APK do emulador é mais antigo que o publicado)
- extendedWaitUntil:
    visible: "Mais tarde"
    timeout: 6000
    optional: true
- tapOn:
    text: "Mais tarde"
    optional: true
- tapOn: "seu.usuario ou email@empresa.com"
- inputText: ${USER}
- tapOn: "Sua senha"
- inputText: ${PASS}
- hideKeyboard
- tapOn: "Entrar"
- extendedWaitUntil:
    visible: "Ajustes"
    timeout: 90000
- tapOn:
    text: "Mais tarde"
    optional: true
