appId: com.obraflow.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Entrar"
    timeout: 60000
- tapOn: "seu.usuario ou email@empresa.com"
- inputText: ${USER}
- tapOn: "Sua senha"
- inputText: ${PASS}
- hideKeyboard
- tapOn: "Entrar"
- extendedWaitUntil:
    visible: "Ajustes"
    timeout: 90000
