    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "(?i)(descartar|sair sem salvar|ok)"
          optional: true
- tapOn: ".*, Ajustes"
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element: "Legendas Técnicas"
    direction: DOWN
- tapOn: "Legendas Técnicas"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 3000
    optional: true
