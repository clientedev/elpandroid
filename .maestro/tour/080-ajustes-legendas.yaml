appId: com.obraflow.app
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible: "Ajustes"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "(?i)(descartar|sair sem salvar|ok)"
          optional: true
- runFlow:
    when:
      notVisible: "Ajustes"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "(?i)(descartar|sair sem salvar|ok)"
          optional: true
- runFlow:
    when:
      notVisible: "Ajustes"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "(?i)(descartar|sair sem salvar|ok)"
          optional: true
