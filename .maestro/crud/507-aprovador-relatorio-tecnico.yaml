appId: com.obraflow.app
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: ".*, Ajustes"
    timeout: 60000
- tapOn:
    text: "Mais tarde"
    optional: true
- extendedWaitUntil:
    visible: "__aguarda__"
