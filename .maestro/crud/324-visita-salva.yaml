appId: com.obraflow.app
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: "Confirmar Agendamento.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Confirmar Agendamento.*"
- extendedWaitUntil:
    visible: "Visita Agendada com Sucesso!"
    timeout: 30000
