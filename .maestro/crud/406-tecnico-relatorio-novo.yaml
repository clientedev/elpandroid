appId: com.obraflow.app
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible: "Ajustes"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "(?i)(descartar|sair sem salvar|ok)"
          optional: true
- runFlow:
    when:
      notVisible: "Ajustes"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "(?i)(descartar|sair sem salvar|ok)"
          optional: true
- runFlow:
    when:
      notVisible: "Ajustes"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "(?i)(descartar|sair sem salvar|ok)"
          optional: true
- runFlow:
    when:
      notVisible: "Ajustes"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "(?i)(descartar|sair sem salvar|ok)"
          optional: true
- tapOn:
    text: ".*, Relatórios"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 1500
    optional: true
- tapOn:
    point: "92%,9%"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "1. Data da Visita.*"
    timeout: 20000
- tapOn:
    text: "(Dropdown|Toque para selecionar a obra.*)"
    index: 0
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Buscar por nome, número ou construtora..."
- inputText: "MANUAL"
- hideKeyboard
- tapOn:
    text: ".*MANUAL - TESTE Obra Residencial.*"
    below: "MANUAL"
    index: 0
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    below: "Título do Laudo"
- eraseText: 80
- inputText: "MANUAL - TESTE Laudo do tecnico"
- hideKeyboard
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 800
    optional: true
