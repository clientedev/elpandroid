appId: com.obraflow.app
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "(Dropdown|Toque para selecionar a obra.*)"
    index: 0
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Buscar por nome, número ou construtora..."
- inputText: "MANUAL"
- hideKeyboard
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 1200
    optional: true
