appId: com.obraflow.app
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: "Salvar Rascunho"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Salvar Rascunho"
- extendedWaitUntil:
    visible: "(Sucesso.*|Salvo.*|Relatórios Express)"
    timeout: 20000
    optional: true
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 1500
    optional: true
