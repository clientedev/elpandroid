appId: com.obraflow.app
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "(?i)ok"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible: "Ajustes"
