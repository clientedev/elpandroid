appId: com.obraflow.app
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: "4. Informações Técnicas da Obra"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "4. Informações Técnicas da Obra"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: "Salvar Informações da Obra"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 800
    optional: true
