appId: com.obraflow.app
---
- scrollUntilVisible:
    element: "Galeria"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Galeria"
- extendedWaitUntil:
    visible: "(Photos|Fotos|Recent|Recentes|Images|Imagens|Select.*|Selecion.*)"
    timeout: 15000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "(Photo taken|Foto tirada).*"
    index: 0
    optional: true
- tapOn:
    text: "foto-teste.*"
    index: 0
    optional: true
- runFlow:
    when:
      visible: "(Photos|Fotos|Albums|Álbuns)"
    commands:
      - tapOn:
          point: "18%,22%"
- extendedWaitUntil:
    visible: "Legenda Técnica.*"
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 1500
    optional: true
- tapOn:
    text: "Digite a legenda da patologia..."
- inputText: "MANUAL - TESTE eflorescencia na base"
- hideKeyboard
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 500
    optional: true
