appId: com.obraflow.app
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "(?i)(aprovar|confirmar)"
    index: 1
    optional: true
- extendedWaitUntil:
    visible: "(Sucesso.*|.*aprovado.*)"
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 800
    optional: true
