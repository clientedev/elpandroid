appId: com.obraflow.app
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "(.OBRA-[0-9]+. .*|Toque para selecionar a obra.*)"
    index: 0
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 1500
    optional: true
