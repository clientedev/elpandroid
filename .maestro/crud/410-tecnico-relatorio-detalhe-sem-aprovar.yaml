appId: com.obraflow.app
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: ".*Laudo do tecnico.*|.*MANUAL - TESTE.*"
    index: 0
- extendedWaitUntil:
    visible: "Detalhes do Relatório"
    timeout: 20000
- scrollUntilVisible:
    element: "Exportar.*"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 800
    optional: true
