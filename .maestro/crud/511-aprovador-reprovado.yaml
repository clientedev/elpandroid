appId: com.obraflow.app
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Confirmar Reprovação"
- extendedWaitUntil:
    visible: "(Sucesso.*|.*reprovado.*)"
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 800
    optional: true
