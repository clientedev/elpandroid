appId: com.obraflow.app
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "(?i)(enviar|confirmar|sim)"
    optional: true
- extendedWaitUntil:
    visible: "(Sucesso.*|.*submetido.*)"
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 1000
    optional: true
