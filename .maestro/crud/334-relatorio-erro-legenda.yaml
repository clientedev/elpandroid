appId: com.obraflow.app
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: "Enviar para Aprovação"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Enviar para Aprovação"
- extendedWaitUntil:
    visible: "Legenda Obrigatória"
    timeout: 15000
