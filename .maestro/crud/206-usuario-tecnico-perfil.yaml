appId: com.obraflow.app
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Técnico de Campo"
- scrollUntilVisible:
    element: "Mínimo 6 caracteres"
    direction: DOWN
- tapOn: "Mínimo 6 caracteres"
- inputText: "${TPASS}"
- hideKeyboard
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 800
    optional: true
