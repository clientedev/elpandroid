appId: com.obraflow.app
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: "Salvar / Concluir"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Salvar / Concluir"
- extendedWaitUntil:
    visible: "(Sucesso.*|Erro.*)"
    timeout: 30000
