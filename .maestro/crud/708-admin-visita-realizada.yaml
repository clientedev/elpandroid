appId: com.obraflow.app
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: ".*, Ajustes"
    timeout: 60000
- tapOn:
    text: "Mais tarde"
    optional: true
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 1500
    optional: true
- runFlow:
    when:
      notVisible: "Ajustes"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "(?i)(descartar|sair sem salvar|ok)"
          optional: true
- runFlow:
    when:
      notVisible: "Ajustes"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "(?i)(descartar|sair sem salvar|ok)"
          optional: true
- runFlow:
    when:
      notVisible: "Ajustes"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "(?i)(descartar|sair sem salvar|ok)"
          optional: true
- runFlow:
    when:
      notVisible: "Ajustes"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "(?i)(descartar|sair sem salvar|ok)"
          optional: true
- tapOn:
    text: ".*, Agenda"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 1500
    optional: true
- tapOn:
    text: ".*MANUAL - TESTE.*"
    index: 0
- extendedWaitUntil:
    visible: "Dados do Agendamento"
    timeout: 15000
- scrollUntilVisible:
    element: "Concluir e Marcar Como Realizada"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Concluir e Marcar Como Realizada"
- extendedWaitUntil:
    visible: "(Sucesso.*|.*Realizada.*)"
    timeout: 20000
    optional: true
- extendedWaitUntil:
    visible: "__aguarda__"
    timeout: 800
    optional: true
