name: Build and Release ELP APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./ELP.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELP-APK
          path: ./ELP.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "ELP Android - Versão Mais Recente"
          body: "APK oficial atualizado automaticamente a cada deploy/push no repositório."
          draft: false
          prerelease: false
          files: ./ELP.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
