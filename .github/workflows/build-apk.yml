name: Build and Release ELP APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    name: Publicar ELP APK no GitHub Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verificar e Preparar ELP.apk
        run: |
          if [ -f "./ELP.apk" ]; then
            echo "✅ ELP.apk encontrado com sucesso na raiz do repositório."
            ls -lh ./ELP.apk
          elif [ -d "android" ]; then
            echo "Compilando via Gradle..."
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../ELP.apk
          else
            echo "❌ Arquivo ELP.apk não encontrado."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELP-APK
          path: ./ELP.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "ELP Android - Versão Mais Recente"
          body: |
            ## 📱 ObraFlow / ELP Android - Versão Oficial Atualizada
            
            - **Arquivo**: `ELP.apk`
            - **Atualização**: Automática via GitHub Actions
            - **Commit**: ${{ github.sha }}
            
            O APK abaixo contém todas as melhorias e revisões de checklist, salvamento confiável e ajustes.
          draft: false
          prerelease: false
          files: ./ELP.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
