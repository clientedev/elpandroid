name: elp-smoke
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - env:
          ADMIN_USER: ${{ secrets.MANUAL_USER }}
          ADMIN_PASS: ${{ secrets.MANUAL_PASS }}
        run: python scripts/elp_smoke.py
