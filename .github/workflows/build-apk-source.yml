name: Compilar ELP APK do codigo-fonte

# Compila o APK a partir do codigo (expo prebuild + Gradle), confere a assinatura,
# atualiza ELP.apk e version.json na main e publica a release "latest".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk-source.yml'

concurrency:
  group: build-apk-source
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      # Chave do APK atual (Android Debug do React Native). Atualizacao por cima
      # do app instalado so funciona se o novo APK tiver a MESMA assinatura.
      EXPECTED_CERT_SHA256: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar projeto Android (expo prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Ajustar memoria do Gradle
        working-directory: android
        run: |
          # O build anterior travou com OutOfMemoryError: Metaspace
          sed -i '/^org.gradle.jvmargs=/d;/^org.gradle.parallel=/d;/^kotlin.daemon.jvmargs=/d;/^reactNativeArchitectures=/d' gradle.properties
          # O arquivo gerado nao termina com quebra de linha: sem isto a 1a linha nova gruda na ultima
          echo "" >> gradle.properties
          {
            echo 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
            echo 'org.gradle.parallel=false'
            echo 'org.gradle.workers.max=2'
            echo 'kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'
            echo 'reactNativeArchitectures=arm64-v8a,armeabi-v7a'
          } >> gradle.properties
          cat gradle.properties

      - name: Compilar APK (release)
        working-directory: android
        run: |
          chmod +x gradlew
          # Só arquiteturas de celulares reais (x86 é emulador); lint de release dispensado (falha por bug no lint do expo-log-box)
          ./gradlew assembleRelease --no-daemon --stacktrace -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease

      - name: Conferir assinatura
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          ACTUAL=$(grep -m1 'SHA-256 digest' certs.txt | awk '{print $NF}')
          echo "Assinatura: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Assinatura diferente do APK atual. Os celulares nao conseguiriam atualizar."
            exit 1
          fi
          cp "$APK" ELP.apk

      - name: Atualizar version.json
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8")).expo;
            const msg = process.env.COMMIT_MSG.split("\n")[0].slice(0, 200);
            const out = {
              version: app.version,
              versionCode: app.android.versionCode,
              updatedAt: new Date().toISOString(),
              notes: `Atualizacao v${app.version}: ${msg}`,
            };
            fs.writeFileSync("version.json", JSON.stringify(out, null, 2) + "\n", "utf8");
            console.log(out);
          '
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || 'compilacao manual' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ELP-APK
          path: ELP.apk

      - name: Salvar ELP.apk e version.json na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ELP.apk version.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          VERSION=$(node -p 'require("./app.json").expo.version')
          git commit -m "build: ELP.apk v${VERSION} compilado do codigo-fonte [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publicar release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ELP Android - Versão Mais Recente"
          body: |
            APK compilado automaticamente do código-fonte (commit ${{ github.sha }}).
          files: ./ELP.apk
          draft: false
          prerelease: false
