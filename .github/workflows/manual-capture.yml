name: Manual - capturas do APK no emulador

# Roda o ELP.apk oficial num emulador Android e executa roteiros do Maestro
# (.maestro/manual/*.yaml) que navegam pelo app e tiram os prints do manual.
# Credenciais da conta de teste vêm dos secrets MANUAL_USER / MANUAL_PASS.
on:
  workflow_dispatch:
    inputs:
      flows:
        description: 'Roteiros a rodar (glob dentro de .maestro/manual)'
        required: false
        default: '[0-9]*.yaml'
      tour:
        description: 'Passos do tour (glob dentro de .maestro/tour)'
        required: false
        default: '[0-9]*.yaml'
  push:
    branches: [main]
    paths:
      - '.maestro/manual/**'
      - '.maestro/tour/**'
      - '.github/workflows/manual-capture.yml'

concurrency:
  group: manual-capture
  cancel-in-progress: true

jobs:
  # O ELP.apk oficial só traz código nativo ARM (celulares). Para o emulador x86_64,
  # compila o MESMO commit só para x86_64 — mesmas telas, mesmo código JS.
  build-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-x86-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: gradle-x86-
      - run: npm ci
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Memoria do Gradle
        working-directory: android
        run: |
          sed -i '/^org.gradle.jvmargs=/d;/^org.gradle.parallel=/d;/^kotlin.daemon.jvmargs=/d;/^reactNativeArchitectures=/d' gradle.properties
          echo "" >> gradle.properties
          {
            echo 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8'
            echo 'org.gradle.parallel=false'
            echo 'org.gradle.workers.max=2'
            echo 'kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'
            echo 'reactNativeArchitectures=x86_64'
          } >> gradle.properties
      - name: Compilar APK x86_64
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease
          cp app/build/outputs/apk/release/app-release.apk ../ELP-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: elp-x86_64
          path: ELP-x86_64.apk
          retention-days: 3

  capture:
    needs: build-x86
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v4
        with:
          name: elp-x86_64

      - name: Instalar Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Emulador + roteiros
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MANUAL_USER: ${{ secrets.MANUAL_USER }}
          MANUAL_PASS: ${{ secrets.MANUAL_PASS }}
          FLOWS: ${{ github.event.inputs.flows || '[0-9]*.yaml' }}
          TOUR: ${{ github.event.inputs.tour || '[0-9]*.yaml' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash .maestro/run-manual.sh

      - name: Publicar capturas na branch manual-capturas
        if: always()
        run: |
          [ -d manual-out ] || exit 0
          cp -r manual-out /tmp/manual-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin manual-capturas || true
          if git rev-parse --verify -q origin/manual-capturas >/dev/null; then
            git checkout -B manual-capturas origin/manual-capturas
          else
            git checkout --orphan manual-capturas && git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          RUN="run-${{ github.run_number }}"
          rm -rf "$RUN" latest && mkdir -p "$RUN" && cp -r /tmp/manual-out/. "$RUN"/ && cp -r "$RUN" latest
          git add -A "$RUN" latest
          git commit -qm "capturas $RUN (${{ github.sha }})" || exit 0
          git push -q origin manual-capturas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-capturas
          path: |
            manual-out/
          retention-days: 14
